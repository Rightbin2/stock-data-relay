name: Fetch Stock Data

on:
  schedule:
    # GitHub 정기 실행은 보통 2~4시간 늦게 시작되므로, 일부러 일찍 시작시키고
    # 아래 '대기' 단계에서 뉴욕 17:15(24시간 거래 자산 일봉 마감 17:00 직후)까지 기다린 뒤 데이터를 받는다.
    # 목표: 한국시간 07:30 메일 전에 완료 (서머타임 중 06:15, 겨울 07:15 KST).
    - cron: '0 17 * * 1-5'   # UTC 월~금 17:00 = KST 화~토 02:00 (1차)
    - cron: '0 19 * * 1-5'   # UTC 월~금 19:00 = KST 화~토 04:00 (2차)
    - cron: '0 21 * * 1-5'   # UTC 월~금 21:00 = KST 화~토 06:00 (3차 백업)
  workflow_dispatch:

concurrency:
  group: fetch-stock-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 450
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: 뉴욕 17:15 이후까지 대기 (정기 실행일 때만)
        if: github.event_name == 'schedule'
        run: |
          python - <<'PY'
          import time
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("America/New_York"))
          target = now.replace(hour=17, minute=15, second=0, microsecond=0)
          wait = (target - now).total_seconds()
          if 0 < wait < 7 * 3600:
              print("대기", int(wait), "초")
              time.sleep(wait)
          else:
              print("대기 불필요")
          PY

      - name: 신호 계산 (daily.json, weekly.json)
        run: python fetch_signals.py

      - name: 저장
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "update data" || echo "no changes"
          git pull --rebase origin main
          git push
